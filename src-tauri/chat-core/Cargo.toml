[package]
name = "study-chat-core"
version = "0.1.0"
edition = "2021"

[features]
native-credentials = ["dep:keyring"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
tempfile = "3"
zeroize = "1"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", optional = true, features = ["windows-native"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", optional = true, features = ["apple-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", optional = true, features = ["sync-secret-service", "crypto-rust", "vendored"] }
