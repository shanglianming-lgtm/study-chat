[package]
name = "study-chat"
version = "0.1.0"
description = "书房 Chat — a quiet place for your thoughts"
authors = ["Study Chat contributors"]
edition = "2021"

[lib]
name = "study_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

study-chat-core = { path = "chat-core", features = ["native-credentials"] }
tauri-plugin-dialog = "2"
serde_json = "1"
